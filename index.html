<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адвент-Майстерня Dnipro-M</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#ff5a00',
                            orangeHover: '#e04f00',
                            black: '#1a1a1a',
                            dark: '#222222',
                            metalDark: '#2d3339',
                            metalLight: '#4a5560',
                        }
                    },
                    boxShadow: {
                        'metal-inset': 'inset 0 4px 6px rgba(0,0,0,0.6), inset 0 -2px 4px rgba(255,255,255,0.1)',
                        'drawer-out': '0 8px 15px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.1)',
                        'neon-orange': '0 0 15px rgba(255, 90, 0, 0.7), inset 0 0 10px rgba(255, 90, 0, 0.3)',
                    },
                    backgroundImage: {
                        'metal-texture': 'linear-gradient(to bottom, #3b4249, #1f2327)',
                        'drawer-texture': 'linear-gradient(to right, #2a2f35, #3f4751, #2a2f35)',
                        'bg-pattern': 'radial-gradient(circle, #333 1px, transparent 1px)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #121212;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
            background-size: cover;
            background-attachment: fixed;
            color: white;
            user-select: none;
        }

        /* Wall organizer pattern */
        .pegboard-bg {
            background-image: radial-gradient(#3a3a3a 2px, transparent 2px);
            background-size: 20px 20px;
        }

        /* Pulse animation for the active day */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 90, 0, 0.5), inset 0 0 5px rgba(255, 90, 0, 0.2); border-color: rgba(255, 90, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 90, 0, 0.9), inset 0 0 15px rgba(255, 90, 0, 0.5); border-color: #ff5a00; }
        }
        .active-day-pulse {
            animation: pulse-glow 2s infinite ease-in-out;
            border: 2px solid #ff5a00;
        }

        /* Shake animation for locked items */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) rotate(-3deg); }
            40% { transform: translateX(4px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-3deg); }
            80% { transform: translateX(4px) rotate(3deg); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Modal mechanical slide */
        @keyframes mechanical-slide-down {
            0% { transform: translateY(-50px) scale(0.95); opacity: 0; }
            70% { transform: translateY(5px) scale(1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .modal-open-anim {
            animation: mechanical-slide-down 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Screw styling for realism */
        .screw {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #777, #333);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.8);
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 2px;
            width: 6px;
            height: 2px;
            background: #222;
            transform: rotate(45deg);
        }

        /* Toast animation */
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-enter {
            animation: toast-in 0.3s ease-out forwards;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans relative pb-10">

    <div class="bg-brand-dark border-b border-gray-700 p-3 sticky top-0 z-50 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-3 text-sm">
        <div class="flex items-center gap-2 text-brand-orange font-bold uppercase tracking-wider">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            Панель розробника (Тест)
        </div>
        <div class="flex items-center gap-3">
            <label for="simulatedDate" class="text-gray-300">Поточна дата:</label>
            <input type="date" id="simulatedDate" class="bg-gray-800 border border-gray-600 text-white px-2 py-1 rounded focus:outline-none focus:border-brand-orange cursor-pointer">
            <button id="resetProgressBtn" class="px-3 py-1 bg-red-900 hover:bg-red-700 text-white rounded transition-colors text-xs font-semibold uppercase">Скинути прогрес</button>
        </div>
    </div>

    <header class="text-center pt-10 pb-6 px-4">
        <h1 class="text-3xl md:text-5xl font-black text-white uppercase tracking-tight mb-3 drop-shadow-lg">
            Адвент-Майстерня <span class="text-brand-orange">Dnipro-M</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-base max-w-2xl mx-auto font-medium">
            Відкривайте нову комірку щодня! На вас чекають професійні поради, цікаві факти та ексклюзивні знижки на інструменти.
        </p>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 w-full max-w-6xl mx-auto">
        <!-- The Pegboard Wall -->
        <div class="w-full pegboard-bg bg-brand-metalDark rounded-xl p-4 sm:p-6 md:p-8 border-[6px] border-gray-800 shadow-[0_15px_50px_rgba(0,0,0,0.7)] relative">
            
            <!-- Structural elements (bolts in corners) -->
            <div class="screw top-2 left-2"></div>
            <div class="screw top-2 right-2"></div>
            <div class="screw bottom-2 left-2"></div>
            <div class="screw bottom-2 right-2"></div>

            <div id="calendar-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mt-2">
                <!-- JavaScript will inject cells here -->
            </div>
        </div>
    </main>

    <footer class="mt-12 text-center opacity-60">
        <div class="flex items-center justify-center gap-2 mb-2">
            <!-- Simulated Logo shape -->
            <div class="w-8 h-8 bg-brand-orange transform rotate-45 flex items-center justify-center">
                <div class="w-4 h-4 bg-black"></div>
            </div>
            <span class="text-xl font-bold uppercase tracking-wider text-white">Dnipro-M</span>
        </div>
        <p class="text-xs text-gray-500 uppercase">&copy; 2026. Тільки для професіоналів.</p>
    </footer>

    <!-- Overlay -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4">
        <!-- Modal Content Box -->
        <div id="modalContent" class="bg-gradient-to-b from-gray-800 to-brand-dark w-full max-w-md rounded-lg border-2 border-brand-orange shadow-2xl relative flex flex-col">
            
            <!-- Modal Header (Mechanical styling) -->
            <div class="bg-brand-black p-4 border-b border-gray-700 flex justify-between items-center rounded-t-md">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-brand-orange shadow-[0_0_8px_#ff5a00]"></div>
                    <h3 id="modalTitle" class="text-xl font-bold uppercase text-white tracking-wide">День X</h3>
                </div>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 md:p-8 flex flex-col items-center text-center">
                
                <!-- Icon container -->
                <div id="modalIconContainer" class="w-20 h-20 rounded-full bg-gray-900 border-4 border-gray-700 flex items-center justify-center mb-6 shadow-inset">
                    <!-- Injected via JS -->
                </div>
                
                <h4 id="modalSubTitle" class="text-lg md:text-xl font-semibold text-brand-orange mb-3">Тип контенту</h4>
                <p id="modalDescription" class="text-gray-300 text-sm md:text-base leading-relaxed mb-6">
                    Опис того, що знаходиться всередині.
                </p>

                <!-- Promo Code Box (Hidden by default) -->
                <div id="promoCodeBox" class="hidden w-full bg-black/50 border border-gray-600 rounded p-4 flex flex-col gap-3">
                    <div class="text-xs text-gray-400 uppercase tracking-wider">Ваш промокод:</div>
                    <div class="flex items-center justify-between bg-gray-800 border border-gray-500 rounded overflow-hidden">
                        <code id="promoCodeText" class="px-4 py-2 text-xl font-mono text-white font-bold w-full text-center"></code>
                        <button id="copyCodeBtn" class="bg-brand-orange hover:bg-brand-orangeHover text-white px-4 py-3 font-semibold transition-colors flex items-center gap-2 border-l border-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[110] flex flex-col gap-2 pointer-events-none">
        <!-- Toasts injected here -->
    </div>

    <script>
        // CONFIGURATION
        const CONFIG = {
            startDate: "2026-10-01", // Start date of the calendar
            totalDays: 14,
            storageKey: "dnipro_advent_state"
        };

        // CONTENT DATA ARRAY
        const adventData = [
            { day: 1, type: 'fact', title: 'Історичний факт', content: 'Перший у світі масовий електроінструмент з\'явився у 1895 році в Німеччині. Це був важкий і незручний дриль.' },
            { day: 2, type: 'tip', title: 'Порада Майстра', content: 'Якщо саморіз погано вкручується в тверде дерево, натріть його різьбу звичайним милом.' },
            { day: 3, type: 'promo', title: 'Знижка на акумулятори', content: 'Даруємо знижку 15% на всі акумуляторні батареї 20V.', code: 'POWER20' },
            { day: 4, type: 'fact', title: 'Про матеріали', content: 'Більшість сучасних корпусів професійних інструментів виготовляються з поліаміду, посиленого скловолокном (Nylon 6). Це робить їх стійкими до ударів.' },
            { day: 5, type: 'tip', title: 'Порада Майстра', content: 'Для ідеально рівного різу болгаркою, використовуйте малярний скотч поверх лінії різу — це зменшить відколи на металі чи плитці.' },
            { day: 6, type: 'promo', title: 'Знижка на ручний інструмент', content: 'Оновіть свій арсенал викруток та ключів зі знижкою 10%.', code: 'HAND10' },
            { day: 7, type: 'fact', title: 'Ергономіка', content: 'Рукоятки інструментів Dnipro-M проектуються з урахуванням анатомії руки, щоб зменшити вібрацію і втому під час тривалої роботи.' },
            { day: 8, type: 'promo', title: 'Знижка на витратні матеріали', content: 'Отримайте 20% знижки на відрізні круги та свердла при купівлі від 3 шт.', code: 'CUT20' },
            { day: 9, type: 'tip', title: 'Порада Майстра', content: 'Ніколи не розряджайте Li-Ion акумулятори "в нуль". Ставте на зарядку, коли залишається одна поділка індикатора — це подовжить термін служби вдвічі.' },
            { day: 10, type: 'fact', title: 'Безщіткові двигуни', content: 'Інструменти з безщітковими (Brushless) двигунами працюють на 30% довше на одному заряді батареї завдяки відсутності тертя вугільних щіток.' },
            { day: 11, type: 'tip', title: 'Порада Майстра', content: 'Зберігайте вимірювальний інструмент (рівні, рулетки, лазери) окремо від ударного інструменту в м\'яких кейсах, щоб не збити калібрування.' },
            { day: 12, type: 'promo', title: 'Знижка на зварювальне обладнання', content: 'Купуйте зварювальні апарати серії SAB зі знижкою 12%!', code: 'WELD12' },
            { day: 13, type: 'fact', title: 'Тестування на міцність', content: 'Усі нові моделі інструментів Dnipro-M проходять суворі краш-тести, включаючи падіння на бетон з висоти 2 метрів та роботу в умовах запиленості.' },
            { day: 14, type: 'promo', title: 'ГРАНД-ФІНАЛ!', content: 'Ви відкрили всі комірки! Забирайте максимальну знижку 25% на один будь-який електроінструмент з чека.', code: 'PROMASTER25' },
        ];

        // SVGs for Icons
        const ICONS = {
            lock: `<svg class="w-8 h-8 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm7 11.25c0 .41-.34.75-.75.75H8.75a.75.75 0 01-.75-.75v-4.5c0-.41.34-.75.75-.75h6.5c.41 0 .75.34.75.75v4.5z"/></svg>`,
            check: `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`,
            cross: `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`,
            promo: `<svg class="w-10 h-10 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>`,
            tip: `<svg class="w-10 h-10 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>`,
            fact: `<svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
        };

        // State Variables
        let openedDays = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || [];
        let simulatedCurrentDate = null; // Used for dev testing

        
        function getRealOrSimulatedDate() {
            // Return simulated date if set, otherwise real current date (accounting for timezone differences roughly by stripping time)
            if (simulatedCurrentDate) {
                return new Date(simulatedCurrentDate);
            }
            const now = new Date();
            // Reset to midnight for clean day comparisons
            now.setHours(0,0,0,0);
            return now;
        }

        function getDayDifference(date1, date2) {
            const msPerDay = 1000 * 60 * 60 * 24;
            // Ensure dates are at midnight to avoid DST issues
            const d1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
            const d2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
            const diffMs = d2 - d1;
            return Math.floor(diffMs / msPerDay);
        }

        function getDayStatus(dayNumber) {
            const startDate = new Date(CONFIG.startDate);
            startDate.setHours(0,0,0,0);
            
            const targetDate = new Date(startDate);
            targetDate.setDate(startDate.getDate() + (dayNumber - 1));
            
            const currentDate = getRealOrSimulatedDate();
            
            const diff = getDayDifference(targetDate, currentDate);
            
            if (diff < 0) {
                return { status: 'future', date: targetDate };
            } else if (diff === 0) {
                return { status: 'current', date: targetDate };
            } else {
                return { status: 'past', date: targetDate };
            }
        }

        function formatDate(date) {
            return date.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }


        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; // Clear existing

            for (let i = 1; i <= CONFIG.totalDays; i++) {
                const dayStatusObj = getDayStatus(i);
                const isOpened = openedDays.includes(i);
                
                // Determine CSS classes based on state
                let baseClasses = "relative rounded-md flex flex-col items-center justify-center min-h-[120px] md:min-h-[140px] transition-all duration-300 select-none ";
                let innerContent = "";
                let clickHandler = "";

                // Visual styling variants to make grid look mechanical
                const visualVariants = [
                    "bg-drawer-texture shadow-drawer-out border-b-8 border-gray-900", // Drawer
                    "bg-metal-texture shadow-metal-inset border-[3px] border-gray-600 rounded-lg", // Box
                    "bg-gradient-to-br from-gray-700 to-gray-900 shadow-drawer-out border-2 border-gray-500 rounded-sm" // Panel
                ];
                const visualStyle = visualVariants[i % 3]; 

                if (dayStatusObj.status === 'future') {
                    // FUTURE DAY
                    baseClasses += `${visualStyle} cursor-not-allowed opacity-80`;
                    innerContent = `
                        <div class="absolute top-2 left-2 text-gray-400 font-bold text-xs opacity-50">${i}</div>
                        <div class="lock-icon-container" id="lock-${i}">${ICONS.lock}</div>
                        
                        <!-- Drawer handle illusion -->
                        <div class="absolute bottom-3 w-12 h-2 rounded bg-black/40 shadow-inner"></div>
                    `;
                    clickHandler = `onclick="handleFutureClick(${i}, '${formatDate(dayStatusObj.date)}')"`;
                
                } else if (dayStatusObj.status === 'current') {
                    // CURRENT DAY (ACTIVE)
                    if (isOpened) {
                        baseClasses += `bg-brand-metalDark border-2 border-brand-orange shadow-drawer-out cursor-pointer hover:bg-gray-700`;
                        innerContent = renderOpenedState(i);
                    } else {
                        baseClasses += `${visualStyle} active-day-pulse cursor-pointer transform hover:scale-105 z-10`;
                        innerContent = `
                            <div class="text-4xl md:text-5xl font-black text-brand-orange drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">${i}</div>
                            <div class="text-xs text-white uppercase tracking-wider mt-2 bg-brand-orange px-2 py-0.5 rounded shadow">Відкрити</div>
                            <div class="absolute bottom-3 w-16 h-3 rounded bg-gray-900 shadow-[inset_0_-1px_1px_rgba(255,255,255,0.2)]"></div>
                        `;
                    }
                    clickHandler = `onclick="openDay(${i})"`;
                
                } else {
                    // PAST DAY
                    baseClasses += `bg-brand-metalDark border-2 border-gray-700 shadow-metal-inset cursor-pointer hover:bg-gray-700`;
                    if (isOpened) {
                        innerContent = renderOpenedState(i);
                    } else {
                        // Missed day
                        innerContent = `
                            <div class="absolute top-2 left-2 text-gray-500 font-bold text-sm">${i}</div>
                            <div class="flex flex-col items-center opacity-40">
                                ${ICONS.cross}
                                <span class="text-[10px] uppercase mt-1 text-gray-400 font-bold tracking-widest">Пропущено</span>
                            </div>
                        `;
                    }
                    // Allow opening missed days too in this version for better UX, or disable them. We'll allow opening.
                    clickHandler = `onclick="openDay(${i})"`;
                }

                // Construct DOM string
                const cellHTML = `
                    <div class="${baseClasses}" ${clickHandler}>
                        ${innerContent}
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cellHTML);
            }
        }

        function renderOpenedState(dayNum) {
            return `
                <div class="absolute top-2 left-2 text-gray-500 font-bold text-sm">${dayNum}</div>
                <div class="flex flex-col items-center">
                    ${ICONS.check}
                    <span class="text-[10px] uppercase mt-1 text-green-500 font-bold tracking-widest shadow-black drop-shadow-md">Відкрито</span>
                </div>
            `;
        }

        
        function handleFutureClick(dayNum, openDateStr) {
            const lockEl = document.getElementById(`lock-${dayNum}`);
            if (lockEl) {
                // Trigger shake animation
                lockEl.classList.remove('animate-shake');
                void lockEl.offsetWidth; // trigger reflow
                lockEl.classList.add('animate-shake');
            }
            showToast(`Комірка закрита. Відкриється: ${openDateStr}`, 'warning');
        }

        function openDay(dayNum) {
            const data = adventData.find(d => d.day === dayNum);
            if (!data) return;

            // Save state if not opened
            if (!openedDays.includes(dayNum)) {
                openedDays.push(dayNum);
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(openedDays));
                // Re-render to update the grid cell to "opened" state silently in background
                renderCalendar(); 
            }

            // Populate Modal
            document.getElementById('modalTitle').textContent = `День ${dayNum} / 14`;
            document.getElementById('modalSubTitle').textContent = data.title;
            document.getElementById('modalDescription').textContent = data.content;
            
            const iconContainer = document.getElementById('modalIconContainer');
            if (data.type === 'promo') iconContainer.innerHTML = ICONS.promo;
            else if (data.type === 'tip') iconContainer.innerHTML = ICONS.tip;
            else iconContainer.innerHTML = ICONS.fact;

            const promoBox = document.getElementById('promoCodeBox');
            if (data.type === 'promo' && data.code) {
                promoBox.classList.remove('hidden');
                document.getElementById('promoCodeText').textContent = data.code;
            } else {
                promoBox.classList.add('hidden');
            }

            // Show Modal
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            // Add animation class
            content.classList.remove('modal-open-anim');
            void content.offsetWidth;
            content.classList.add('modal-open-anim');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        
        // Close on clicking outside
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Copy to clipboard
        document.getElementById('copyCodeBtn').addEventListener('click', function() {
            const code = document.getElementById('promoCodeText').textContent;
            
            // Using execCommand as requested in constraints
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Промокод скопійовано!', 'success');
                
                // Visual feedback on button
                const btn = this;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                btn.classList.replace('bg-brand-orange', 'bg-green-600');
                btn.classList.replace('hover:bg-brand-orangeHover', 'hover:bg-green-700');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.replace('bg-green-600', 'bg-brand-orange');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-brand-orangeHover');
                }, 2000);
                
            } catch (err) {
                showToast('Не вдалося скопіювати', 'error');
            }
            document.body.removeChild(textArea);
        });

        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            
            const toast = document.createElement('div');
            toast.className = `toast-enter px-4 py-3 rounded shadow-lg flex items-center gap-3 text-sm font-medium border-l-4 pointer-events-auto bg-gray-900 text-white`;
            
            if (type === 'warning') toast.classList.add('border-yellow-500');
            else if (type === 'success') toast.classList.add('border-green-500');
            else if (type === 'error') toast.classList.add('border-red-500');
            else toast.classList.add('border-brand-orange');

            let icon = '';
            if (type === 'warning') icon = `<svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
            else if (type === 'success') icon = ICONS.check;
            else icon = `<svg class="w-5 h-5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => {
                    if(container.contains(toast)) container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        
        function initDevTools() {
            const dateInput = document.getElementById('simulatedDate');
            const resetBtn = document.getElementById('resetProgressBtn');

            // Default dev tool date to real today, formatted for input type="date" YYYY-MM-DD
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;

            dateInput.addEventListener('change', (e) => {
                if (e.target.value) {
                    simulatedCurrentDate = e.target.value;
                } else {
                    simulatedCurrentDate = null;
                }
                renderCalendar();
                showToast(`Системну дату змінено на ${formatDate(getRealOrSimulatedDate())}`, 'info');
            });

            resetBtn.addEventListener('click', () => {
                openedDays = [];
                localStorage.removeItem(CONFIG.storageKey);
                renderCalendar();
                showToast('Прогрес скинуто!', 'info');
            });
        }

        // Boot the app
        window.onload = () => {
            initDevTools();
            
            // For presentation purposes, let's override the initial date 
            // to October 6, 2026 (matching the provided prompt context)
            // so we can see Past (1-5), Current (6), Future (7-14) states immediately.
            const forcedStart = "2026-10-06";
            document.getElementById('simulatedDate').value = forcedStart;
            simulatedCurrentDate = forcedStart;
            
            renderCalendar();
        };
    </script>
</body>
</html>
